[package]
name = "markdown-desk"
version = "0.6.1"
description = "Local Markdown and Mermaid workbench"
authors = ["Markdown Desk"]
edition = "2024"

[features]
installed = []

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-clipboard-manager = "=2.5.0"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-log = "=2.10.1"
log = "=0.4.35"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
base64 = "=0.23.1"
tokio = { version = "=1.54.1", features = ["sync", "time"] }
lopdf = "=0.47.0"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "=0.56.0"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 8
strip = true

